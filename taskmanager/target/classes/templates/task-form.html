<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Form</title>
</head>
<body>

<h1 th:text="${task.id == null}
     ? 'Create New Task'
     : 'Edit Task'">
    Task Form
</h1>

<!--- Adding redirect ---->
<a th:href="@{/tasks}">Return to Tasks</a>

<br><br>

<form th:object="${task}"
      th:action="${task.id == null}
      ? @{/tasks}
      : @{/tasks/{id}/edit(id=${task.id})}"
    method="post">




<!----- Adding Task fields ------>
<div>
    <label for="title">Title:</label>

    <input type="text"
           id="title"
           th:field="*{title}"
           required>
</div>

<br>


<div>
    <label for="description">Description:</label>

    <textarea id="description"
              th:field="*{description}"
              rows="4"
              cols="40"></textarea>
</div>

<br>


<div>
    <label for="dueDate">Due Date:</label>

    <input type="date"
              id="dueDate"
              th:field="*{dueDate}">
</div>

<br>



<div>
    <label for="completed">Completed:</label>

    <input type="checkbox"
           id="completed"
           th:field="*{completed}">
</div>

<br>



<!---- Adding a submit button ---->

<button type="submit"
        th:text="${task.id == null}
     ? 'Create New Task'
     : 'Edit Task'">
    Save
</button>
</form>


</body>
</html>
